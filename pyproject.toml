[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-matchup-projections"
version = "0.1.0"
description = "Project how every player performs in a specific MLB matchup, from 2026 Statcast data: point-in-time features, walk-forward backtests, and a Monte Carlo game simulator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Leo Kohn", email = "leo@kohn.be" }]
keywords = ["baseball", "mlb", "statcast", "sabermetrics", "machine-learning", "simulation", "projections"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pybaseball>=2.2.7",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "tensorflow>=2.15",
    "pyyaml>=6.0",
    "requests>=2.28",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
mlb-matchup = "matchup.cli:main"

[project.urls]
Homepage = "https://github.com/LKohn4/mlb-matchup-projections"
Issues = "https://github.com/LKohn4/mlb-matchup-projections/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
